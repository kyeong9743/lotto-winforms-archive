<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>loading</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #D5D5D5;
        }
        .loading {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            border-top: 7px dotted #e74c3c;
            position: relative;
            box-sizing: border-box;
            animation: rotation1 2s linear infinite;
        }
        .loading::after,
        .loading::before {
            content: '';
            width: 200px;
            height: 200px;
            position: absolute;
            top: -7px;
            left: 0;
            border-radius: 50%;
            box-sizing: border-box;
        }
        .loading::after {
            border-top: 7px dotted #e67e22; 
            transform: rotate(120deg);
        }
        .loading::before {
            border-top: 7px dotted #2980b9; 
            transform: rotate(-120deg);
        }
        .loading span {
            color: #1900ff;
            font-size: 20px;
            position: absolute;
            width: 200px;
            height: 200px;
            text-align: center;
            line-height: 200px;
            animation: rotation2 2s linear infinite;
        }

        @keyframes rotation1 {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes rotation2 {
            to {
                transform: rotate(-360deg);
            }
        }
    </style>
    <script>
        document.documentElement.style.overflowY = 'hidden';

        document.documentElement.style.overflowX = 'hidden';

        window.addEventListener("contextmenu", function (e) {
            e.preventDefault();
        });

        window.addEventListener("copy", function (e) {
            e.preventDefault();
        });

        window.addEventListener("dragstart", function (e) {
            e.preventDefault();
        });

        window.addEventListener("selectstart", function (e) {
            e.preventDefault();
        });

        window.addEventListener("contextmenu", function (e) {
            e.preventDefault();
        });

        window.addEventListener("copy", function (e) {
            e.preventDefault();
        });

        window.addEventListener("dragstart", function (e) {
            e.preventDefault();
        });

        window.addEventListener("selectstart", function (e) {
            e.preventDefault();
        });

    </script>
</head>
<body>

    <div class="loading">
        <span>Loading...</span>
    </div>
</body>
</html>
